# Replace finance.example.com and paths; provision TLS before nginx -t/reload.
server {
 listen 80;
 server_name finance.example.com;
 return 301 https://$host$request_uri;
}
server {
 listen 443 ssl;
 server_name finance.example.com;
 ssl_certificate /etc/letsencrypt/live/finance.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/finance.example.com/privkey.pem;
 root /srv/finanzas/current;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://open.er-api.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'; manifest-src 'self'" always;
 location ~ /\. { deny all; }
 location ~* (\.backup\.json|\.env)$ { deny all; }
 location / { try_files $uri $uri/ =404; }
 location = /index.html { add_header Cache-Control no-cache; }
 location = /sw.js { add_header Cache-Control no-cache; }
 location = /manifest.webmanifest { add_header Cache-Control no-cache; }
 # Cache hashed assets. Include security headers here too if adding add_header,
 # because nginx header inheritance changes when child blocks set headers.
 location /assets/ { expires 1y; }
 # Identity API; finance records remain local. Preserve browser Origin.
 location /api/auth/ {
  proxy_pass http://127.0.0.1:3001;
  proxy_set_header Host $host;
  proxy_set_header Origin $http_origin;
  client_max_body_size 8k;
 }
}
